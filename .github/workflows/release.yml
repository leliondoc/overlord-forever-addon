# Deploie sur CurseForge + GitHub Releases a chaque tag semver (ex. 1.0.0).
# Avant de tagger : mettre a jour Overlord.toc, Core.lua et CHANGELOG.md.
name: Package and release

on:
  push:
    tags:
      - '*.*.*'
      - '*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Valider CHANGELOG.md (une seule version)
        run: bash .github/scripts/validate-changelog.sh CHANGELOG.md "${GITHUB_REF_NAME}"

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installer les validateurs
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 pandoc

      - name: Valider versions, syntaxe Lua et fronts Forever
        run: |
          TOC_VERSION=$(sed -n 's/^## Version: //p' Overlord.toc)
          CORE_VERSION=$(sed -n 's/^Overlord.Version = "\([^"]*\)"/\1/p' Core.lua)
          test "$TOC_VERSION" = "${GITHUB_REF_NAME}"
          test "$CORE_VERSION" = "${GITHUB_REF_NAME}"

          mapfile -t LUA_FILES < <(find . -maxdepth 1 -type f -name '*.lua' -print | sort)
          lua5.1 tests/lua_syntax_check.lua "${LUA_FILES[@]}"
          lua5.1 tests/zone_capture_lease.test.lua
          lua5.1 tests/forever_persistence.test.lua
          lua5.1 tests/forever_panel_position.test.lua
          lua5.1 tests/forever_recovery.test.lua
          lua5.1 tests/forever_popups_persistence.test.lua
          lua5.1 tests/forever_leaderboard.test.lua
          lua5.1 tests/forever_display_cache.test.lua
          lua5.1 tests/forever_world_kills.test.lua
          lua5.1 tests/forever_honorable_kills.test.lua
          lua5.1 tests/forever_kill_ceiling.test.lua
          lua5.1 tests/forever_guild_totals.test.lua
          lua5.1 tests/forever_performance.test.lua
          lua5.1 tests/forever_us_reset.test.lua
          lua5.1 tests/forever_kill_row_removal.test.lua
          lua5.1 tests/forever_resource_maps.test.lua
          lua5.1 tests/forever_capture_locations.test.lua
          lua5.1 tests/forever_siege_schedule.test.lua
          lua5.1 tests/forever_silverpine_outpost.test.lua
          lua5.1 tests/forever_beta_network.test.lua
          lua5.1 tests/forever_beta_integration.test.lua
          lua5.1 tests/forever_beta_catchup.test.lua
          lua5.1 tests/forever_general.test.lua
          lua5.1 tests/forever_contracts.test.lua
          lua5.1 tests/forever_contract_mail.test.lua

          mapfile -t TEST_FILES < <(find tests -maxdepth 1 -type f -name '*.test.mjs' -print | sort)
          node --test "${TEST_FILES[@]}"

      - name: Valider les secrets de publication
        run: |
          if [ -z "$CF_API_KEY" ]; then
            echo "CF_API_KEY absent - publication impossible." >&2
            exit 1
          fi

      - name: Preparer changelog HTML pour CurseForge
        run: |
          pandoc CHANGELOG.md -f gfm -t html --wrap=none -o CHANGELOG.cf.html
          cat > .pkgmeta.ci << 'EOF'
          package-as: Overlord
          manual-changelog:
            filename: CHANGELOG.cf.html
            markup-type: html
          ignore:
            - README.md
            - CHANGELOG.md
            - CHANGELOG.cf.html
            - .gitignore
            - .github
            - .pkgmeta
            - .pkgmeta.ci
            - .release
            - tests
            - docs
            - _local
          EOF

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -m .pkgmeta.ci -n "Overlord-{project-version}:Overlord-{project-version}"
