# Deploie sur CurseForge + GitHub Releases a chaque tag semver (ex. 1.0.0).
# Avant de tagger : mettre a jour Overlord.toc, Core.lua et CHANGELOG.md.
name: Package and release

on:
  push:
    tags:
      - '*.*.*'
      - '*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Valider CHANGELOG.md (une seule version)
        run: bash .github/scripts/validate-changelog.sh CHANGELOG.md "${GITHUB_REF_NAME}"

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installer les validateurs
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 pandoc

      - name: Valider versions, syntaxe Lua et fronts Forever
        run: |
          TOC_VERSION=$(sed -n 's/^## Version: //p' Overlord.toc)
          CORE_VERSION=$(sed -n 's/^Overlord.Version = "\([^"]*\)"/\1/p' Core.lua)
          test "$TOC_VERSION" = "${GITHUB_REF_NAME}"
          test "$CORE_VERSION" = "${GITHUB_REF_NAME}"

          mapfile -t LUA_FILES < <(find . -maxdepth 1 -type f -name '*.lua' -print | sort)
          lua5.1 tests/lua_syntax_check.lua "${LUA_FILES[@]}"
          lua5.1 tests/zone_capture_lease.test.lua
          lua5.1 tests/forever_trust_relay_142.test.lua
          lua5.1 tests/forever_ladder_injection.test.lua
          lua5.1 tests/forever_ladder_signatures.test.lua
          lua5.1 tests/forever_outpost_capturer_claims.test.lua
          lua5.1 tests/forever_sites_week.test.lua
          lua5.1 tests/forever_persistence.test.lua
